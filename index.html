<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fbfaf8" />
    <meta name="description" content="Практика — реальные задачи бизнеса для студенческих команд." />
    <title>Новая задача — Практика</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#business" aria-label="Практика — главная">Практика</a>
        <nav class="primary-nav" aria-label="Основная навигация">
          <button class="nav-link is-current" data-view="business">Мои задачи</button>
          <button class="nav-link" data-view="catalog">Каталог</button>
        </nav>
        <div class="topbar-end">
          <div class="role-switch" role="group" aria-label="Режим просмотра">
            <button class="role-option is-selected" aria-pressed="true">Бизнес</button>
            <button class="role-option" aria-pressed="false">Команда</button>
          </div>
          <span class="topbar-divider"></span>
          <button class="profile-button" aria-label="Профиль Ивана Крылова">
            <span class="avatar">ИК</span><span class="profile-copy"><strong>Иван Крылов</strong><small>Кафе «Зелёный лист»</small></span><span class="profile-chevron">⌄</span>
          </button>
        </div>
      </header>
      <main id="business-root" tabindex="-1" aria-live="polite"></main>
      <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    </div>
  </body>
</html>
